name: timber
description: "Timber — Your files, beautifully organized."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Media access (used in Module 3)
  photo_manager: ^3.2.0

  # Local database (used in Module 2)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20

  # Storage & paths
  path_provider: ^2.1.3
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # Video playback (used in Module 7)
  video_player: ^2.9.1
  chewie: ^1.8.1

  # Image caching
  cached_network_image: ^3.4.0

  # Sharing
  share_plus: ^9.0.0

  # Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift code generation
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true